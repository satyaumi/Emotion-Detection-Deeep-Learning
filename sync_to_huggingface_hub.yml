name: Deploy to Hugging Face Spaces

on:
  push:
    branches:
      - main  # Trigger deployment on the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    # Checkout the repository
    - name: Checkout code
      uses: actions/checkout@v3

    # Install huggingface_hub Python library
    - name: Install dependencies
      run: |
        python3 -m pip install --upgrade pip
        pip install huggingface_hub

    # Deploy to Hugging Face Spaces
    - name: Deploy to Hugging Face Spaces
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        python3 -m huggingface_hub repo upload \
          --repo-id satyamlk/Emotion-Detection \
          --path . --token $HF_TOKEN --commit-message "Deploying changes"
